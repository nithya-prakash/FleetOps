[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetops"
version = "0.1.0"
description = "Edge-to-cloud MLOps platform: deploy, monitor, update and roll back AI models across factory edge devices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy~=2.5.4",
  "safetensors~=0.8.0",
  "pydantic~=2.14.1",
  "pydantic-settings~=2.15.0",
  "paho-mqtt~=2.1.0",
  "httpx~=0.28.1",
  "prometheus-client~=0.26.0",
  "psutil~=7.2.2",
  "fastapi~=0.143.0",
  "uvicorn~=0.54.0",
]

[project.optional-dependencies]
# Control plane: persistence, registry, drift statistics.
control = [
  "sqlalchemy~=2.1.4",
  "alembic~=1.20.0",
  "mlflow-skinny~=3.17.0",
  "scipy~=1.18.1",
  "pandas~=3.0.6",
  "pandera~=0.34.1",
]
# Model training (PyTorch). Never installed on the edge.
train = ["torch~=2.14.1"]
# Offline inference-runtime benchmark only (scripts/benchmarks); the edge image stays NumPy-only.
bench = ["onnx~=1.23.2", "onnxruntime~=1.31.0"]
dev = [
  "pytest~=9.1.1",
  "pytest-asyncio~=1.4.0",
  "pytest-cov~=7.1.0",
  "ruff~=0.17.0",
  "mypy~=2.4.0",
  "types-psutil",
  "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleetops"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "S", "N", "ASYNC", "T20"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "PLR", "S311"]
"src/fleetops/persistence/migrations/**" = ["E501", "N999"]
"scripts/**" = ["T20", "S603", "S607"]  # operator scripts call the docker/kubectl CLIs by design
"scripts/gen_dashboard.py" = ["E501"]  # PromQL expressions
"scripts/load_test/**" = ["E501", "PLC0415", "S603", "S607", "T201"]  # report formatting; docker CLI by design
"scripts/backup.py" = ["E501", "S108"]  # docstring prose; /tmp is inside the target container, not on the host
"scripts/benchmarks/**" = ["E501", "PLC0415", "S603", "SLF001", "T201", "RUF100"]  # report formatting; builds ONNX from model internals by design

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "safetensors.*", "pandera.*", "scipy.*", "paho.*", "torch.*", "alembic.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "mqtt: needs a real Mosquitto broker (FLEETOPS_TEST_MQTT_HOST); skipped otherwise",
]
filterwarnings = ["error::DeprecationWarning:fleetops.*"]

[tool.coverage.run]
source = ["src/fleetops"]

# Reproducible installs: `uv.lock` pins every dependency (with hashes). On Linux (containers, CI) torch comes
# from the CPU-only index so images do not pull CUDA wheels; macOS uses the regular PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# Least-privilege topic access. Pattern lines apply to every authenticated user, with %u = username
# (devices authenticate with username == device_id).

# devices: read only their own commands; write only their own uplink topics
pattern read  fleetops/devices/%u/commands
pattern write fleetops/devices/%u/heartbeat
pattern write fleetops/devices/%u/telemetry
pattern write fleetops/devices/%u/predictions
pattern write fleetops/devices/%u/status

# control plane: read all uplink, write commands
user control-plane
topic read  fleetops/devices/+/heartbeat
topic read  fleetops/devices/+/telemetry
topic read  fleetops/devices/+/predictions
topic read  fleetops/devices/+/status
topic write fleetops/devices/+/commands

# FleetOps Mosquitto - mutual-TLS profile: clients must present a certificate signed by the CA, and still authenticate. DEVELOPMENT certificates come from
# scripts/devcerts.py; production must use certificates from your own PKI (docs/security.md).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl

max_packet_size 262144
max_inflight_messages 20
persistent_client_expiration 7d

listener 8883
cafile /mosquitto/run/tls/ca.crt
certfile /mosquitto/run/tls/server.crt
keyfile /mosquitto/run/tls/server.key
require_certificate true

# FleetOps Mosquitto configuration (local profile).
# DEVELOPMENT: plaintext listener, credentials generated by scripts/provision.py. The password file is
# copied from a secret into a private tmpfs (mode 0600) by deploy/docker/mosquitto-entrypoint.sh.
# PRODUCTION: enable the TLS listener below, disable 1883, and manage users with the
# dynamic-security plugin or client certificates (see docs/security.md).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl

max_packet_size 262144
max_queued_messages 1000
max_inflight_messages 20
persistent_client_expiration 7d

listener 1883

# --- TLS listener (not exercised by the local demo) ---
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
# require_certificate false

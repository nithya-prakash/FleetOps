global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fleetops-control-plane
    metrics_path: /metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs:
      - targets: ["control-plane:8000"]

  - job_name: fleetops-edge
    metrics_path: /metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs:
      - targets: ["edge-01:9100", "edge-02:9100", "edge-03:9100"]

# MLflow basic-auth configuration (non-secret). The admin password comes from MLFLOW_AUTH_ADMIN_PASSWORD, which
# deploy/docker/mlflow-entrypoint.sh reads from the mlflow_admin_password secret file.
[mlflow]
# Authenticated users may read; only owners/managers (and admin) may create, edit or delete.
default_permission = READ
database_uri = sqlite:////data/basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
